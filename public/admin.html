<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel · Desapegos Fitness</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topo">
    <h1 class="marca">Desapegos <span>FITNESS · PAINEL</span></h1>
    <p class="slogan">Cadastre peças com foto em "Nova peça". Para editar, altere os campos e clique em Salvar (ou aperte Enter).</p>
    <div class="acoes">
      <a class="btn contorno" href="/" target="_blank">Ver catálogo</a>
      <button class="btn claro" id="nova">+ Nova peça</button>
      <button class="btn contorno" id="sair">Sair</button>
    </div>
  </header>

  <div class="filtros">
    <input id="busca" type="search" placeholder="Filtrar por referência, nome, marca, tamanho ou arquivo…">
    <span class="contagem" id="contagem"></span>
  </div>

  <main class="painel">
    <div class="grade" id="grade"></div>
  </main>

  <div class="modal" id="modal-nova" hidden>
    <form class="modal-caixa" id="form-nova" novalidate>
      <h2>Nova peça</h2>
      <label class="foto-escolha" id="foto-escolha">
        <input type="file" id="foto-input" accept="image/*" hidden>
        <img id="foto-previa" alt="" hidden>
        <span class="foto-texto" id="foto-texto"><b>Escolher foto</b><small>ou tirar agora com a câmera</small></span>
      </label>
      <div><label>Nome</label><input type="text" name="nome" placeholder="Ex.: Conjunto top + short" required></div>
      <div class="linha">
        <div><label>Marca</label><input type="text" name="marca" placeholder="Ex.: Alto Giro" list="marcas"></div>
        <div><label>Tamanho</label><input type="text" name="tamanho" placeholder="P, M, G, 38…" list="tamanhos"></div>
      </div>
      <div class="linha">
        <div><label>Preço (R$)</label><input type="number" name="preco" step="0.01" min="0" inputmode="decimal" placeholder="0,00"></div>
        <div><label>Promocional (R$)</label><input type="number" name="preco_promocional" step="0.01" min="0" inputmode="decimal" placeholder="0,00"></div>
      </div>
      <p class="status" id="nova-status"></p>
      <div class="modal-acoes">
        <button type="button" class="btn cinza" id="nova-cancelar">Cancelar</button>
        <button type="submit" class="btn" id="nova-salvar">Cadastrar peça</button>
      </div>
    </form>
  </div>

  <div class="aviso" id="aviso"></div>

  <div class="login" id="login" hidden>
    <div class="login-fundo" aria-hidden="true"><span></span><span></span><span></span></div>
    <form class="login-caixa" id="form-login" novalidate>
      <div class="login-logo"><img src="/logo.png" alt="" onerror="this.parentNode.remove()"></div>
      <h1 class="login-marca">Desapegos <span>FITNESS</span></h1>
      <p class="login-sub">Painel do catálogo</p>
      <label class="campo">
        <span>Usuário</span>
        <input name="usuario" autocomplete="username" required autofocus placeholder="seu usuário">
      </label>
      <label class="campo">
        <span>Senha</span>
        <span class="campo-senha">
          <input name="senha" type="password" autocomplete="current-password" required placeholder="••••••••">
          <button type="button" class="olho" id="olho" aria-label="Mostrar senha" title="Mostrar senha"></button>
        </span>
      </label>
      <button class="btn entrar" type="submit" id="entrar"><span>Entrar</span></button>
      <p class="login-erro" id="login-erro" role="alert"></p>
      <p class="login-rodape">Acesso restrito · Looks que ganham novas histórias</p>
    </form>
  </div>

<script>
const $ = s => document.querySelector(s);
const grade = $('#grade');
let produtos = [];
let avisoTimer;

function aviso(msg) {
  const el = $('#aviso');
  el.textContent = msg; el.classList.add('mostrar');
  clearTimeout(avisoTimer); avisoTimer = setTimeout(() => el.classList.remove('mostrar'), 2200);
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function renderizar() {
  const busca = $('#busca').value.trim().toLowerCase();
  const lista = produtos.filter(p => !busca || `${p.codigo} ${p.nome} ${p.marca} ${p.tamanho} ${p.arquivo}`.toLowerCase().includes(busca));
  $('#contagem').textContent = `${lista.length} de ${produtos.length} peças`;

  grade.innerHTML = lista.map(p => `
    <article class="card editar ${p.disponivel ? '' : 'vendido'}" data-id="${p.id}" draggable="${busca ? 'false' : 'true'}">
      <div class="arrastar" title="Arraste para mudar a ordem">
        <button type="button" class="mover" data-dir="-1" aria-label="Mover para trás">◀</button>
        <span>⠿ arrastar</span>
        <button type="button" class="mover" data-dir="1" aria-label="Mover para frente">▶</button>
      </div>
      <span class="selo ref">REF ${esc(p.codigo)}</span>
      <img class="foto" src="${esc(p.miniatura)}" alt="" loading="lazy">
      <div class="info">
        <div><label>Nome</label><input type="text" name="nome" value="${esc(p.nome)}" placeholder="Ex.: Conjunto top + short"></div>
        <div class="linha">
          <div><label>Marca</label><input type="text" name="marca" value="${esc(p.marca)}" placeholder="Ex.: Alto Giro" list="marcas"></div>
          <div><label>Tamanho</label><input type="text" name="tamanho" value="${esc(p.tamanho)}" placeholder="P, M, G, 38…" list="tamanhos"></div>
        </div>
        <div class="linha">
          <div><label>Preço (R$)</label><input type="number" name="preco" step="0.01" min="0" inputmode="decimal" value="${p.preco ?? ''}" placeholder="0,00"></div>
          <div><label>Promocional (R$)</label><input type="number" name="preco_promocional" step="0.01" min="0" inputmode="decimal" value="${p.preco_promocional ?? ''}" placeholder="0,00"></div>
        </div>
        <div class="rodape">
          <label><input type="checkbox" name="disponivel" ${p.disponivel ? 'checked' : ''}> Disponível</label>
          <span class="status"></span>
          <button type="button" class="btn salvar">Salvar</button>
        </div>
        <div class="arquivo-linha"><span class="arquivo">${esc(p.arquivo)}</span><button type="button" class="excluir" title="Excluir esta peça">Excluir</button></div>
      </div>
    </article>`).join('');

  const marcas = [...new Set(produtos.map(p => p.marca).filter(Boolean))].sort();
  const tamanhos = [...new Set(produtos.map(p => p.tamanho).filter(Boolean))].sort();
  $('#marcas').innerHTML = marcas.map(m => `<option value="${esc(m)}">`).join('');
  $('#tamanhos').innerHTML = tamanhos.map(t => `<option value="${esc(t)}">`).join('');
}

async function salvar(card) {
  const id = card.dataset.id;
  const status = card.querySelector('.status');
  const dados = {};
  card.querySelectorAll('input').forEach(i => { dados[i.name] = i.type === 'checkbox' ? i.checked : i.value; });

  status.className = 'status'; status.textContent = 'Salvando…';
  try {
    const r = await fetch(`/api/produtos/${id}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados),
    });
    const resp = await r.json();
    if (r.status === 401) { mostrarLogin(); throw new Error('Faça login'); }
    if (!r.ok) throw new Error(resp.erro || 'Erro ao salvar');
    const i = produtos.findIndex(p => p.id == id);
    produtos[i] = resp;
    card.classList.toggle('vendido', !resp.disponivel);
    card.classList.remove('alterado');
    status.className = 'status ok'; status.textContent = 'Salvo ✓';
    setTimeout(() => { if (status.textContent === 'Salvo ✓') status.textContent = ''; }, 1800);
  } catch (e) {
    status.className = 'status erro'; status.textContent = e.message;
  }
}

grade.addEventListener('input', e => e.target.closest('.card')?.classList.add('alterado'));
grade.addEventListener('change', e => {
  const card = e.target.closest('.card');
  if (card && e.target.type === 'checkbox') salvar(card);
});
grade.addEventListener('click', e => {
  const btn = e.target.closest('.salvar');
  if (btn) salvar(btn.closest('.card'));
  const excluir = e.target.closest('.excluir');
  if (excluir) excluirCard(excluir.closest('.card'));
  const mover = e.target.closest('.mover');
  if (mover) moverCard(mover.closest('.card'), Number(mover.dataset.dir));
});

// ---- Reordenar (arrastar ou setas) ----
let arrastando = null;

grade.addEventListener('dragstart', e => {
  const card = e.target.closest('.card');
  if (!card || card.draggable === false || e.target.tagName === 'INPUT') { e.preventDefault(); return; }
  arrastando = card;
  card.classList.add('arrastando');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', card.dataset.id);
});
grade.addEventListener('dragover', e => {
  if (!arrastando) return;
  e.preventDefault();
  const alvo = e.target.closest('.card');
  if (!alvo || alvo === arrastando) return;
  const r = alvo.getBoundingClientRect();
  const depois = e.clientX > r.left + r.width / 2;
  alvo.parentNode.insertBefore(arrastando, depois ? alvo.nextSibling : alvo);
});
grade.addEventListener('drop', e => e.preventDefault());
grade.addEventListener('dragend', () => {
  if (!arrastando) return;
  arrastando.classList.remove('arrastando');
  arrastando = null;
  salvarOrdem();
});

function moverCard(card, dir) {
  if ($('#busca').value.trim()) { aviso('Limpe o filtro para reordenar.'); return; }
  const irmao = dir < 0 ? card.previousElementSibling : card.nextElementSibling;
  if (!irmao) return;
  card.parentNode.insertBefore(card, dir < 0 ? irmao : irmao.nextSibling);
  card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  salvarOrdem();
}

async function salvarOrdem() {
  const ids = [...grade.querySelectorAll('.card')].map(c => Number(c.dataset.id));
  if (ids.length !== produtos.length) { aviso('Limpe o filtro para reordenar.'); renderizar(); return; }
  produtos.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
  produtos.forEach((p, i) => { p.ordem = i; });
  try {
    const r = await fetch('/api/ordem', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids }) });
    if (r.status === 401) { mostrarLogin(); throw new Error('Faça login'); }
    if (!r.ok) throw new Error((await r.json()).erro || 'Erro');
    aviso('Ordem salva ✓');
  } catch (e) {
    aviso('Erro ao salvar a ordem: ' + e.message);
  }
}
grade.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); salvar(e.target.closest('.card')); }
});

$('#busca').addEventListener('input', renderizar);

// ---- Nova peça (foto redimensionada no navegador e enviada ao armazenamento) ----
let fotoEscolhida = null;

async function redimensionar(arquivo, alturaMax, qualidade) {
  let bitmap;
  try { bitmap = await createImageBitmap(arquivo, { imageOrientation: 'from-image' }); }
  catch { bitmap = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = URL.createObjectURL(arquivo); }); }
  const w = bitmap.width, hh = bitmap.height;
  const escala = Math.min(1, alturaMax / hh);
  const cv = document.createElement('canvas'); cv.width = Math.round(w * escala); cv.height = Math.round(hh * escala);
  cv.getContext('2d').drawImage(bitmap, 0, 0, cv.width, cv.height);
  return new Promise(ok => cv.toBlob(ok, 'image/jpeg', qualidade));
}

function slug(t) {
  return String(t || 'peca').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'peca';
}

function abrirNova() { $('#modal-nova').hidden = false; $('#form-nova input[name=nome]').focus(); }
function fecharNova() {
  $('#modal-nova').hidden = true; $('#form-nova').reset(); fotoEscolhida = null;
  $('#foto-previa').hidden = true; $('#foto-previa').src = ''; $('#foto-texto').hidden = false;
  $('#nova-status').textContent = ''; $('#nova-status').className = 'status';
}
$('#nova').addEventListener('click', abrirNova);
$('#nova-cancelar').addEventListener('click', fecharNova);
$('#modal-nova').addEventListener('click', e => { if (e.target === e.currentTarget) fecharNova(); });

$('#foto-input').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  fotoEscolhida = f;
  const previa = await redimensionar(f, 500, 0.8);
  $('#foto-previa').src = URL.createObjectURL(previa); $('#foto-previa').hidden = false; $('#foto-texto').hidden = true;
});

async function enviarFoto(tipo, arquivo, blob) {
  const r = await fetch(`/api/upload?tipo=${tipo}&arquivo=${encodeURIComponent(arquivo)}`, { method: 'PUT', headers: { 'Content-Type': 'image/jpeg' }, body: blob });
  if (r.status === 401) { mostrarLogin(); throw new Error('Faça login'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || 'Falha ao enviar a foto');
}

$('#form-nova').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target; const st = $('#nova-status'); const btn = $('#nova-salvar');
  const falha = m => { st.className = 'status erro'; st.textContent = m; };
  if (!fotoEscolhida) return falha('Escolha a foto da peça.');
  if (!f.nome.value.trim()) return falha('Dê um nome para a peça.');
  btn.disabled = true; st.className = 'status';
  try {
    st.textContent = 'Preparando a foto…';
    const [grande, mini] = await Promise.all([redimensionar(fotoEscolhida, 1600, 0.85), redimensionar(fotoEscolhida, 700, 0.8)]);
    const arquivo = `${Date.now()}_${slug(f.nome.value)}.jpg`;
    st.textContent = 'Enviando a foto…';
    await enviarFoto('img', arquivo, grande);
    await enviarFoto('thumb', arquivo, mini);
    st.textContent = 'Cadastrando…';
    const r = await fetch('/api/produtos', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ arquivo, nome: f.nome.value, marca: f.marca.value, tamanho: f.tamanho.value, preco: f.preco.value, preco_promocional: f.preco_promocional.value }) });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { mostrarLogin(); throw new Error('Faça login'); }
    if (!r.ok) throw new Error(d.erro || 'Não foi possível cadastrar');
    produtos.push(d); renderizar(); fecharNova(); aviso(`Peça REF ${d.codigo} cadastrada ✓`);
    document.querySelector(`.card[data-id="${d.id}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (err) { falha(err.message); }
  finally { btn.disabled = false; }
});

// ---- Excluir peça ----
async function excluirCard(card) {
  const p = produtos.find(x => x.id == card.dataset.id);
  if (!confirm(`Excluir a peça REF ${p.codigo} (${p.nome})? A foto também será apagada.`)) return;
  const r = await fetch(`/api/produtos/${p.id}`, { method: 'DELETE' });
  if (r.status === 401) return mostrarLogin();
  if (!r.ok) return aviso('Não foi possível excluir.');
  produtos = produtos.filter(x => x.id !== p.id); renderizar(); aviso(`REF ${p.codigo} excluída`);
}

async function carregar() {
  produtos = await fetch('/api/produtos').then(r => r.json());
  renderizar();
}

// ---- Login ----
function mostrarLogin() { $('#login').hidden = false; $('#form-login input[name=usuario]').focus(); }
function esconderLogin() { $('#login').hidden = true; $('#login-erro').textContent = ''; $('#login-erro').classList.remove('mostrar'); }

$('#olho').addEventListener('click', () => {
  const i = $('#form-login input[name=senha]');
  const mostrar = i.type === 'password';
  i.type = mostrar ? 'text' : 'password';
  $('#olho').classList.toggle('aberto', mostrar);
  $('#olho').title = mostrar ? 'Ocultar senha' : 'Mostrar senha';
  $('#olho').setAttribute('aria-label', $('#olho').title);
  i.focus();
});

function erroLogin(msg) {
  const el = $('#login-erro'); el.textContent = msg; el.classList.remove('mostrar');
  void el.offsetWidth; el.classList.add('mostrar');
}

$('#form-login').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (!f.usuario.value.trim() || !f.senha.value) return erroLogin('Preencha usuário e senha.');
  const botao = $('#entrar'); botao.disabled = true; botao.classList.add('carregando');
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ usuario: f.usuario.value, senha: f.senha.value }) });
  const d = await r.json().catch(() => ({}));
  botao.disabled = false; botao.classList.remove('carregando');
  if (!r.ok) { erroLogin(d.erro || 'Não foi possível entrar.'); f.senha.select(); return; }
  f.reset(); esconderLogin(); aviso('Bem-vinda!'); carregar();
});

$('#sair').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  mostrarLogin();
});

(async () => {
  const eu = await fetch('/api/eu').then(r => r.json()).catch(() => ({}));
  if (eu.logado) carregar(); else mostrarLogin();
})();
</script>
<datalist id="marcas"></datalist>
<datalist id="tamanhos"></datalist>
</body>
</html>
