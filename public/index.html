<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desapegos Fitness · Catálogo</title>
  <meta name="description" content="Roupas fitness seminovas e em ótimo estado. Looks que ganham novas histórias.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topo">
    <div class="cabecalho">
      <img class="logo" src="/logo.png" alt="Logo Desapegos Fitness" onerror="this.remove()">
      <div class="textos">
        <h1 class="marca">Desapegos <span>FITNESS</span></h1>
        <p class="slogan">Roupas fitness seminovas e em ótimo estado · Looks que ganham novas histórias</p>
      </div>
    </div>
  </header>

  <div class="filtros">
    <input id="busca" type="search" placeholder="Buscar por referência, nome ou marca…">
    <select id="marca"><option value="">Todas as marcas</option></select>
    <select id="tamanho"><option value="">Todos os tamanhos</option></select>
    <select id="mostrar">
      <option value="disponiveis">Só disponíveis</option>
      <option value="todos">Todos (inclui vendidos)</option>
    </select>
    <span class="contagem" id="contagem"></span>
  </div>

  <main class="grade" id="grade"></main>
  <p class="rodape-site">Desapegos Fitness · <a href="/admin">painel</a></p>

  <div class="lightbox" id="lightbox">
    <button class="fechar" aria-label="Fechar">×</button>
    <div class="oferta">
      <canvas id="oferta-canvas" width="1080" height="1080"></canvas>
      <div class="oferta-acoes">
        <button type="button" class="btn baixar" id="baixar">⬇ Download imagem</button>
      </div>
    </div>
  </div>

<script>
const brl = v => v == null ? '' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const WHATSAPP = '5551981126240';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function linkWhats(p) {
  const linhas = [
    'Olá! Tenho interesse nesta peça do catálogo Desapegos Fitness:',
    '',
    `Referência: ${p.codigo}`,
    `Peça: ${p.nome || 'sem nome'}`,
    p.marca && `Marca: ${p.marca}`,
    p.tamanho && `Tamanho: ${p.tamanho}`,
    p.preco != null && `Preço: ${brl(p.preco)}`,
    p.preco_promocional != null && `Valor promocional: ${brl(p.preco_promocional)}`,
  ].filter(l => l === '' || (l && l !== true));
  return `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(linhas.join('\n'))}`;
}
let produtos = [];

const $ = s => document.querySelector(s);
const grade = $('#grade');

function preencherFiltros() {
  const marcas = [...new Set(produtos.map(p => p.marca).filter(Boolean))].sort();
  const tamanhos = [...new Set(produtos.map(p => p.tamanho).filter(Boolean))].sort();
  $('#marca').innerHTML = '<option value="">Todas as marcas</option>' + marcas.map(m => `<option>${m}</option>`).join('');
  $('#tamanho').innerHTML = '<option value="">Todos os tamanhos</option>' + tamanhos.map(t => `<option>${t}</option>`).join('');
}

function renderizar() {
  const busca = $('#busca').value.trim().toLowerCase();
  const marca = $('#marca').value;
  const tamanho = $('#tamanho').value;
  const mostrar = $('#mostrar').value;

  const lista = produtos.filter(p =>
    (mostrar === 'todos' || p.disponivel) &&
    (!marca || p.marca === marca) &&
    (!tamanho || p.tamanho === tamanho) &&
    (!busca || `${p.codigo} ${p.nome} ${p.marca} ${p.tamanho}`.toLowerCase().includes(busca))
  );

  $('#contagem').textContent = `${lista.length} ${lista.length === 1 ? 'peça' : 'peças'}`;
  grade.innerHTML = lista.map(p => {
    const temPromo = p.preco_promocional != null && (p.preco == null || p.preco_promocional < p.preco);
    let precos;
    if (temPromo) {
      precos = `${p.preco != null ? `<span class="preco-antigo">${brl(p.preco)}</span>` : ''}<span class="preco preco-promo">${brl(p.preco_promocional)}</span>`;
    } else if (p.preco != null) {
      precos = `<span class="preco">${brl(p.preco)}</span>`;
    } else {
      precos = `<span class="sem-preco">consulte o valor</span>`;
    }
    const detalhes = [p.marca && `<b>${esc(p.marca)}</b>`, p.tamanho && `Tam. ${esc(p.tamanho)}`].filter(Boolean).join(' · ');
    return `
      <article class="card ${p.disponivel ? '' : 'vendido'}" data-id="${p.id}">
        ${!p.disponivel ? '<span class="selo vendido">Vendido</span>' : ''}
        <span class="selo ref">REF ${esc(p.codigo)}</span>
        <img class="foto" src="${esc(p.miniatura)}" alt="${esc(p.nome)}" loading="lazy">
        <div class="info">
          <p class="nome">${esc(p.nome) || 'Sem nome'}</p>
          <p class="detalhes">${detalhes || '&nbsp;'}</p>
          <div class="precos">${precos}</div>
          ${p.disponivel ? `<a class="btn whats" href="${linkWhats(p)}" target="_blank" rel="noopener">Quero essa peça</a>` : ''}
        </div>
      </article>`;
  }).join('') || '<p style="grid-column:1/-1;text-align:center;color:var(--texto-suave)">Nenhuma peça encontrada.</p>';
}

// ---------- Arte quadrada da oferta (1080x1080) ----------
const FONTE = '"Segoe UI", Roboto, Helvetica, Arial, sans-serif';
const CORES = { creme: '#f8f4ee', escuro: '#14524b', verde: '#1f7a6f', claro: '#8fc9b4', texto: '#143d3a', suave: '#5b7572', promo: '#c8553d', branco: '#ffffff' };
let ofertaAtual = null;

const carregarImg = src => new Promise((ok, erro) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = erro; i.src = src; });

// Desenha a imagem preenchendo a área (corta o excesso, como object-fit: cover).
function desenharCover(ctx, img, x, y, w, h) {
  const r = Math.max(w / img.width, h / img.height);
  const sw = w / r, sh = h / r;
  ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h);
}

function quebrarLinhas(ctx, texto, maxLargura, maxLinhas) {
  const palavras = String(texto).split(/\s+/); const linhas = []; let atual = '';
  for (const p of palavras) {
    const teste = atual ? atual + ' ' + p : p;
    if (ctx.measureText(teste).width > maxLargura && atual) { linhas.push(atual); atual = p; } else atual = teste;
  }
  if (atual) linhas.push(atual);
  if (linhas.length > maxLinhas) { linhas.length = maxLinhas; linhas[maxLinhas - 1] = linhas[maxLinhas - 1].replace(/\s?\S*$/, '…'); }
  return linhas;
}

function pilula(ctx, texto, cx, y, fundo, cor, fonte) {
  ctx.font = fonte; const w = ctx.measureText(texto).width + 44, h = 48;
  ctx.fillStyle = fundo; ctx.beginPath(); ctx.roundRect(cx - w / 2, y, w, h, 24); ctx.fill();
  ctx.fillStyle = cor; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(texto, cx, y + h / 2 + 1);
  return y + h;
}

async function gerarOferta(p) {
  const cv = $('#oferta-canvas'); const W = cv.width, H = cv.height;
  const ctx = cv.getContext('2d');
  const [foto, logo] = await Promise.all([
    carregarImg(p.foto),
    carregarImg('/logo.png').catch(() => null),
  ]);

  ctx.fillStyle = CORES.creme; ctx.fillRect(0, 0, W, H);

  // Foto à esquerda, altura inteira
  const fw = 620;
  desenharCover(ctx, foto, 0, 0, fw, H);

  // Painel à direita
  const px = fw, pw = W - fw, cx = px + pw / 2;
  ctx.fillStyle = CORES.escuro; ctx.fillRect(px, 0, 6, H);
  let y = 56;

  if (logo) {
    const r = 92;
    ctx.save(); ctx.beginPath(); ctx.arc(cx, y + r, r, 0, Math.PI * 2); ctx.clip();
    ctx.drawImage(logo, cx - r, y, r * 2, r * 2); ctx.restore();
    ctx.lineWidth = 5; ctx.strokeStyle = CORES.claro; ctx.beginPath(); ctx.arc(cx, y + r, r, 0, Math.PI * 2); ctx.stroke();
    y += r * 2 + 44;
  } else {
    ctx.fillStyle = CORES.escuro; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = `italic bold 52px ${FONTE}`; ctx.fillText('Desapegos', cx, y + 50);
    ctx.font = `600 26px ${FONTE}`; ctx.fillStyle = CORES.verde; ctx.fillText('F I T N E S S', cx, y + 90);
    y += 130;
  }

  y = pilula(ctx, `REF ${p.codigo}`, cx, y, CORES.escuro, CORES.claro, `bold 24px ${FONTE}`) + 36;

  // Nome
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = CORES.texto; ctx.font = `bold 44px ${FONTE}`;
  for (const l of quebrarLinhas(ctx, p.nome || 'Peça', pw - 70, 3)) { ctx.fillText(l, cx, y + 40); y += 52; }
  y += 14;

  // Marca e tamanho
  const det = [p.marca, p.tamanho && `Tam. ${p.tamanho}`].filter(Boolean).join('  ·  ');
  if (det) { ctx.fillStyle = CORES.suave; ctx.font = `28px ${FONTE}`; ctx.fillText(det, cx, y + 28); y += 60; }

  // Linha divisória
  y += 14; ctx.strokeStyle = CORES.claro; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - 90, y); ctx.lineTo(cx + 90, y); ctx.stroke(); y += 40;

  // Preços
  const temPromo = p.preco_promocional != null && (p.preco == null || p.preco_promocional < p.preco);
  if (temPromo) {
    if (p.preco != null) {
      ctx.fillStyle = CORES.suave; ctx.font = `30px ${FONTE}`;
      const t = `de ${brl(p.preco)}`; ctx.fillText(t, cx, y + 30);
      const w = ctx.measureText(t).width; ctx.strokeStyle = CORES.suave; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx - w / 2, y + 20); ctx.lineTo(cx + w / 2, y + 20); ctx.stroke();
      y += 52;
    }
    ctx.fillStyle = CORES.suave; ctx.font = `26px ${FONTE}`; ctx.fillText('por', cx, y + 26); y += 34;
    ctx.fillStyle = CORES.promo; ctx.font = `bold 72px ${FONTE}`; ctx.fillText(brl(p.preco_promocional), cx, y + 68); y += 90;
  } else if (p.preco != null) {
    ctx.fillStyle = CORES.escuro; ctx.font = `bold 72px ${FONTE}`; ctx.fillText(brl(p.preco), cx, y + 68); y += 90;
  } else {
    ctx.fillStyle = CORES.suave; ctx.font = `italic 32px ${FONTE}`; ctx.fillText('Consulte o valor', cx, y + 32); y += 60;
  }

  if (!p.disponivel) { y += 10; pilula(ctx, 'VENDIDO', cx, y, CORES.suave, CORES.branco, `bold 26px ${FONTE}`); }

  // Rodapé
  ctx.fillStyle = CORES.suave; ctx.textAlign = 'center';
  ctx.font = `23px ${FONTE}`; ctx.fillText('Roupas fitness seminovas', cx, H - 122); ctx.fillText('e em ótimo estado', cx, H - 92);
  ctx.font = `bold 28px ${FONTE}`; ctx.fillStyle = CORES.escuro; ctx.fillText('WhatsApp (51) 98112-6240', cx, H - 48);
}

grade.addEventListener('click', async e => {
  const img = e.target.closest('.foto');
  if (!img) return;
  const p = produtos.find(x => x.id == img.closest('.card').dataset.id);
  ofertaAtual = p;
  $('#lightbox').classList.add('aberto');
  $('#baixar').disabled = true;
  try { await gerarOferta(p); $('#baixar').disabled = false; }
  catch (err) { console.error(err); }
});

$('#baixar').addEventListener('click', () => {
  if (!ofertaAtual) return;
  $('#oferta-canvas').toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `desapegos-fitness-ref-${ofertaAtual.codigo}.jpg`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/jpeg', 0.92);
});

$('#lightbox').addEventListener('click', e => { if (!e.target.closest('.oferta')) $('#lightbox').classList.remove('aberto'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#lightbox').classList.remove('aberto'); });

['#busca', '#marca', '#tamanho', '#mostrar'].forEach(s => $(s).addEventListener('input', renderizar));

fetch('/api/produtos').then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(d => { produtos = d; preencherFiltros(); renderizar(); })
  .catch(() => { grade.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--texto-suave)">Não foi possível carregar as peças.</p>'; });
</script>
</body>
</html>
